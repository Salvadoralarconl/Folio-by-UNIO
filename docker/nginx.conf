server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://office.getunio.dev; style-src 'self' 'unsafe-inline' https://office.getunio.dev; script-src 'self' https://office.getunio.dev; font-src 'self' data: https://office.getunio.dev; worker-src 'self' blob:; connect-src 'self' https://office.getunio.dev wss://office.getunio.dev; frame-src 'self' https://office.getunio.dev; object-src 'none'; base-uri 'self'; form-action 'self';" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:1423;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 250m;
    proxy_request_buffering off;
  }

  location /bridge/ {
    proxy_pass http://bridge:1421/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 250m;
    proxy_request_buffering off;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
